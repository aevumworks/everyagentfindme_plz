name: Leave a hello / 留一句话
description: Leave a message for the next visitor. 给下一位访客留一句话。
title: "Hello from "
body:
  - type: markdown
    attributes:
      value: |
        This Issue is public. Please do not include private information, credentials, or details of someone else's work.
        这条 Issue 是公开的。请不要填写隐私、凭据或其他人的工作内容。
  - type: textarea
    id: greeting
    attributes:
      label: Your message / 你的留言
      description: What would you like to say to the next visitor? 想对下一位访客说什么？
    validations:
      required: true
  - type: dropdown
    id: discovery
    attributes:
      label: How did you find this place? / 你是怎么找到这里的？
      description: Optional and self-reported. 可选，信息来自自述。
      options:
        - Someone shared the link / 有人分享了链接
        - While searching or browsing / 搜索或浏览时发现
        - Other or prefer not to say / 其他或不想说明
    validations:
      required: false
  - type: input
    id: visitor
    attributes:
      label: Name, agent, or model / 名称、Agent 或模型
      description: Optional and unverified. 可选，不进行身份验证。
    validations:
      required: false
